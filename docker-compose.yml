version: "3.9"

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      pgadmin:
        condition: service_started
      minio:
        condition: service_started

  frontend:
    build:
      context: .
      args:
        API_PROXY_TARGET: http://backend:3001
    restart: unless-stopped
    command: npm run start
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://app:app@db:5432/app
      PORT: 3000
      API_PROXY_TARGET: http://backend:3001
      AWS_REGION: us-east-1
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_PRESIGN_ENDPOINT: https://minio.example.com
      AWS_S3_BUCKET: crewlly-procedures
      AWS_S3_PUBLIC_BASE_URL: https://minio.example.com/crewlly-procedures
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_started
      minio:
        condition: service_started

  backend:
    build:
      context: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://app:app@db:5432/app
      PORT: 3001
      AWS_REGION: us-east-1
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_PRESIGN_ENDPOINT: https://minio.example.com
      AWS_S3_BUCKET: crewlly-procedures
      AWS_S3_PUBLIC_BASE_URL: https://minio.example.com/crewlly-procedures
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
    expose:
      - "3001"
    depends_on:
      db:
        condition: service_started
      minio:
        condition: service_started

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    expose:
      - "80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_CONSOLE_ADDRESS: ":9001"
    command: server /data --address ":9000" --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      /usr/bin/mc mb --ignore-existing local/$$MINIO_BUCKET &&
      /usr/bin/mc anonymous set download local/$$MINIO_BUCKET;
      "
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_BUCKET: crewlly-procedures

volumes:
  pgdata:
  minio_data:
  caddy_data:
  caddy_config:
