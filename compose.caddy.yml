services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      CADDY_APP_DOMAIN: ${CADDY_APP_DOMAIN:?Set CADDY_APP_DOMAIN in .env.production}
      CADDY_API_DOMAIN: ${CADDY_API_DOMAIN:?Set CADDY_API_DOMAIN in .env.production}
      CADDY_PGADMIN_DOMAIN: ${CADDY_PGADMIN_DOMAIN:?Set CADDY_PGADMIN_DOMAIN in .env.production}
      CADDY_MINIO_API_DOMAIN: ${CADDY_MINIO_API_DOMAIN:?Set CADDY_MINIO_API_DOMAIN in .env.production}
      CADDY_MINIO_CONSOLE_DOMAIN: ${CADDY_MINIO_CONSOLE_DOMAIN:?Set CADDY_MINIO_CONSOLE_DOMAIN in .env.production}
      CADDY_ADMIN_DOMAIN: ${CADDY_ADMIN_DOMAIN:?Set CADDY_ADMIN_DOMAIN in .env.production}
      BASIC_AUTH_USER1_NAME: ${BASIC_AUTH_USER1_NAME:?Set BASIC_AUTH_USER1_NAME in .env.production}
      BASIC_AUTH_USER1_HASH: ${BASIC_AUTH_USER1_HASH:?Set BASIC_AUTH_USER1_HASH in .env.production}
      BASIC_AUTH_USER2_NAME: ${BASIC_AUTH_USER2_NAME:?Set BASIC_AUTH_USER2_NAME in .env.production}
      BASIC_AUTH_USER2_HASH: ${BASIC_AUTH_USER2_HASH:?Set BASIC_AUTH_USER2_HASH in .env.production}
      BASIC_AUTH_USER3_NAME: ${BASIC_AUTH_USER3_NAME:?Set BASIC_AUTH_USER3_NAME in .env.production}
      BASIC_AUTH_USER3_HASH: ${BASIC_AUTH_USER3_HASH:?Set BASIC_AUTH_USER3_HASH in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app_net
    # Intentionally no depends_on here: front/back are managed in compose.app.yml
    # and cross-compose depends_on is not supported by docker compose.

volumes:
  caddy_data:
  caddy_config:

networks:
  app_net:
    external: true
    name: app_net
