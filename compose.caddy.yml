services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app_net
    # Intentionally no depends_on here: front/back are managed in compose.app.yml
    # and cross-compose depends_on is not supported by docker compose.

volumes:
  caddy_data:
  caddy_config:

networks:
  app_net:
    external: true
    name: app_net
