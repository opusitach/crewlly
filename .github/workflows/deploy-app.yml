name: Deploy App

on:
  push:
    branches:
      - main
    paths:
      # GitHub Actions matches paths literally. App runtime code is still shared in the
      # repo root (/front and /back are placeholders for future split), so watch both sets.
      - ".github/workflows/deploy-app.yml"
      - "compose.app.yml"
      - "Dockerfile"
      - "front/**"
      - "back/**"
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "prisma/**"
      - "public/**"
      - "styles/**"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "next.config.mjs"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "components.json"
      - ".dockerignore"

concurrency:
  group: deploy-app
  cancel-in-progress: true

jobs:
  # ── 1. Build the app Docker image and push to GHCR ────────────────────────
  build:
    name: Build & push app image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required for GITHUB_TOKEN to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/crewlly-app:latest
            ghcr.io/${{ github.repository_owner }}/crewlly-app:sha-${{ github.sha }}
          # GHA layer cache: cold first build, fast incremental rebuilds after.
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  # ── 2. Deploy the pre-built image to the VPS ──────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - name: Deploy app stack via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_PATH,GHCR_TOKEN,GHCR_OWNER,COMMIT_SHA
          script: |
            set -eu
            DEPLOY_PATH="${DEPLOY_PATH:-/home/ubuntu/crewlly}"
            echo "Using DEPLOY_PATH=$DEPLOY_PATH"
            test -d "$DEPLOY_PATH" || { echo "Deploy path does not exist: $DEPLOY_PATH"; exit 1; }
            cd "$DEPLOY_PATH"

            LOCK_FILE="$DEPLOY_PATH/.deploy.lock"
            command -v flock >/dev/null 2>&1 || { echo "flock is required on the VPS"; exit 1; }
            exec 9>"$LOCK_FILE"
            flock -w 600 9 || { echo "Could not acquire deploy lock: $LOCK_FILE"; exit 1; }
            echo "Acquired deploy lock: $LOCK_FILE"

            sync_repo() {
              if git pull --ff-only origin main; then
                return 0
              fi

              echo "git pull failed, pruning remote refs and retrying once..."
              git remote prune origin || true
              git fetch --prune origin
              git merge --ff-only origin/main
            }

            test -f .env.production || { echo "Missing .env.production in $DEPLOY_PATH"; exit 1; }
            docker network inspect app_net >/dev/null 2>&1 || docker network create app_net

            sync_repo

            # Authenticate to GHCR so Docker can pull the private image.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_OWNER" --password-stdin

            # Pin deploy to the exact commit SHA built above (not :latest).
            export APP_IMAGE="ghcr.io/${GHCR_OWNER}/crewlly-app:sha-${COMMIT_SHA}"
            export COMPOSE_IGNORE_ORPHANS=1

            # One-time migration cleanup: remove legacy app containers (frontend/backend)
            # from old all-in-one compose stacks so only split stack (front/back) remains.
            if [ -f docker-compose.yml ]; then
              docker compose --env-file .env.production -f docker-compose.yml rm -sf frontend backend || true
            fi
            if [ -f docker-compose.prod.yml ]; then
              docker compose --env-file .env.production -f docker-compose.prod.yml rm -sf frontend backend || true
            fi

            # Pull the pre-built image (no --build: image was already built in CI).
            docker compose --env-file .env.production -f compose.app.yml pull
            docker compose --env-file .env.production -f compose.app.yml up -d

            echo "App deploy complete: $APP_IMAGE"
