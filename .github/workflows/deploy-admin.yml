name: Deploy Admin

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-admin.yml"
      - "compose.admin.yml"
      - "internal-admin/**"
      # Shared code imported by the admin app at build time.
      - "lib/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"

concurrency:
  group: deploy-admin
  cancel-in-progress: true

jobs:
  # ── 1. Build the admin Docker image and push to GHCR ──────────────────────
  build:
    name: Build & push admin image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required for GITHUB_TOKEN to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admin image
        uses: docker/build-push-action@v5
        with:
          # Build context is the REPO ROOT — internal-admin/Dockerfile requires
          # access to shared /lib and /prisma directories (see Dockerfile note).
          context: .
          dockerfile: internal-admin/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/crewlly-admin:latest
            ghcr.io/${{ github.repository_owner }}/crewlly-admin:sha-${{ github.sha }}
          # Use a separate GHA cache scope so it doesn't collide with crewlly-app cache.
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  # ── 2. Deploy the pre-built image to the VPS ──────────────────────────────
  deploy:
    name: Deploy admin to VPS
    needs: build
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - name: Deploy admin service via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_PATH,GHCR_TOKEN,GHCR_OWNER,COMMIT_SHA
          script: |
            set -eu
            DEPLOY_PATH="${DEPLOY_PATH:-/home/ubuntu/crewlly}"
            echo "Using DEPLOY_PATH=$DEPLOY_PATH"
            test -d "$DEPLOY_PATH" || { echo "Deploy path does not exist: $DEPLOY_PATH"; exit 1; }
            cd "$DEPLOY_PATH"

            LOCK_FILE="$DEPLOY_PATH/.deploy.lock"
            command -v flock >/dev/null 2>&1 || { echo "flock is required on the VPS"; exit 1; }
            exec 9>"$LOCK_FILE"
            flock -w 600 9 || { echo "Could not acquire deploy lock: $LOCK_FILE"; exit 1; }
            echo "Acquired deploy lock: $LOCK_FILE"

            sync_repo() {
              if git pull --ff-only origin main; then
                return 0
              fi
              echo "git pull failed, pruning remote refs and retrying once..."
              git remote prune origin || true
              git fetch --prune origin
              git merge --ff-only origin/main
            }

            test -f .env.production || { echo "Missing .env.production in $DEPLOY_PATH"; exit 1; }
            docker network inspect app_net >/dev/null 2>&1 || docker network create app_net

            sync_repo

            # Authenticate to GHCR so Docker can pull the private image.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_OWNER" --password-stdin

            # Pin deploy to the exact commit SHA built above (not :latest).
            export ADMIN_IMAGE="ghcr.io/${GHCR_OWNER}/crewlly-admin:sha-${COMMIT_SHA}"
            export COMPOSE_IGNORE_ORPHANS=1

            # We include compose.app.yml so Docker Compose sees the full service graph
            # (migrate, back, etc.) and resolves the admin's depends_on correctly.
            # --no-deps ensures only internal_admin is restarted — migrations are already
            # applied by the app stack and the DB is shared.
            docker compose --env-file .env.production \
              -f compose.app.yml -f compose.admin.yml \
              pull internal_admin

            docker compose --env-file .env.production \
              -f compose.app.yml -f compose.admin.yml \
              up -d --no-deps internal_admin

            echo "Admin deploy complete: $ADMIN_IMAGE"
