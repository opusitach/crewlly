services:
  # Current architecture is a single Next.js codebase reused by two services.
  # /front and /back are deploy-oriented directories for future source split,
  # but the actual build still uses the shared root Dockerfile.
  # One-shot migration job kept in the app stack so schema changes can be applied
  # before back/front start. It retries to tolerate DB startup lag from compose.data.yml.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - /bin/sh
      - -ec
      - |
        attempts=0
        until npx prisma@5.19.1 migrate deploy; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 30 ]; then
            echo "Prisma migrate deploy failed after $$attempts attempts"
            exit 1
          fi
          echo "Waiting for database to become ready..."
          sleep 2
        done
    restart: "no"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@db:5432/app}
    networks:
      - app_net

  back:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start -- -p 3001
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_SERVICE_NAME: crewlly-back
      NODE_ENV: production
      AUDIT_LOG_ENABLED: ${AUDIT_LOG_ENABLED:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@db:5432/app}
      PORT: 3001
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env.production}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in .env.production}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:?Set EMAIL_VERIFICATION_SECRET in .env.production}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in .env.production}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://minio:9000}
      AWS_S3_PRESIGN_ENDPOINT: ${AWS_S3_PRESIGN_ENDPOINT:?Set AWS_S3_PRESIGN_ENDPOINT in .env.production}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-crewlly-procedures}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL:?Set AWS_S3_PUBLIC_BASE_URL in .env.production}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minio123}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      app_net:
        aliases:
          - backend

  internal_scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: node lib/internal-scheduler/run.mjs
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_SERVICE_NAME: crewlly-internal-scheduler
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      INTERNAL_SCHEDULER_BASE_URL: ${INTERNAL_SCHEDULER_BASE_URL:-http://back:3001}
      INTERNAL_SCHEDULER_STATE_PATH: ${INTERNAL_SCHEDULER_STATE_PATH:-/tmp/internal-scheduler-state.json}
      INTERNAL_CRON_SECRET: ${INTERNAL_CRON_SECRET:-}
      STALE_SHIFT_AUTO_CLOSE_INTERVAL_SECONDS: ${STALE_SHIFT_AUTO_CLOSE_INTERVAL_SECONDS:-900}
      STALE_SHIFT_AUTO_CLOSE_URL: ${STALE_SHIFT_AUTO_CLOSE_URL:-}
      STALE_SHIFT_AUTO_CLOSE_CRON_SECRET: ${STALE_SHIFT_AUTO_CLOSE_CRON_SECRET:-}
      WORK_INTERVAL_CONSISTENCY_INTERVAL_SECONDS: ${WORK_INTERVAL_CONSISTENCY_INTERVAL_SECONDS:-900}
      WORK_INTERVAL_CONSISTENCY_URL: ${WORK_INTERVAL_CONSISTENCY_URL:-}
      WORK_INTERVAL_CONSISTENCY_CRON_SECRET: ${WORK_INTERVAL_CONSISTENCY_CRON_SECRET:-}
    depends_on:
      back:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "lib/internal-scheduler/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app_net

  front:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://back:3001}
    command: npm run start -- -p 3000
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_SERVICE_NAME: crewlly-front
      NODE_ENV: production
      AUDIT_LOG_ENABLED: ${AUDIT_LOG_ENABLED:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@db:5432/app}
      PORT: 3000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env.production}
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://back:3001}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in .env.production}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:?Set EMAIL_VERIFICATION_SECRET in .env.production}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in .env.production}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://minio:9000}
      AWS_S3_PRESIGN_ENDPOINT: ${AWS_S3_PRESIGN_ENDPOINT:?Set AWS_S3_PRESIGN_ENDPOINT in .env.production}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-crewlly-procedures}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL:?Set AWS_S3_PUBLIC_BASE_URL in .env.production}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minio123}
    expose:
      - "3000"
    depends_on:
      back:
        condition: service_healthy
    networks:
      app_net:
        aliases:
          - frontend

networks:
  app_net:
    external: true
    name: app_net
