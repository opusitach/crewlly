services:
  # Current architecture is a single Next.js codebase reused by two services.
  # /front and /back are deploy-oriented directories for future source split,
  # but the actual build still uses the shared root Dockerfile.
  # One-shot migration job kept in the app stack so schema changes can be applied
  # before back/front start. It retries to tolerate DB startup lag from compose.data.yml.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - /bin/sh
      - -ec
      - |
        attempts=0
        until npx prisma@5.19.1 migrate deploy; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 30 ]; then
            echo "Prisma migrate deploy failed after $$attempts attempts"
            exit 1
          fi
          echo "Waiting for database to become ready..."
          sleep 2
        done
    restart: "no"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@db:5432/app}
    networks:
      - app_net

  back:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start -- -p 3001
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@db:5432/app}
      PORT: 3001
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env.production}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://minio:9000}
      AWS_S3_PRESIGN_ENDPOINT: ${AWS_S3_PRESIGN_ENDPOINT:?Set AWS_S3_PRESIGN_ENDPOINT in .env.production}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-crewlly-procedures}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL:?Set AWS_S3_PUBLIC_BASE_URL in .env.production}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minio123}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      app_net:
        aliases:
          - backend

  front:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://back:3001}
    command: npm run start -- -p 3000
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@db:5432/app}
      PORT: 3000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env.production}
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://back:3001}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://minio:9000}
      AWS_S3_PRESIGN_ENDPOINT: ${AWS_S3_PRESIGN_ENDPOINT:?Set AWS_S3_PRESIGN_ENDPOINT in .env.production}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-crewlly-procedures}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL:?Set AWS_S3_PUBLIC_BASE_URL in .env.production}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minio123}
    expose:
      - "3000"
    depends_on:
      back:
        condition: service_healthy
    networks:
      app_net:
        aliases:
          - frontend

networks:
  app_net:
    external: true
    name: app_net
