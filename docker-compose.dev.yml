version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    command: sh -c "npx prisma@5.19.1 generate && npx prisma@5.19.1 db push && npm run dev -- -H 0.0.0.0 -p 3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "1"
      DATABASE_URL: postgresql://app:app@db:5432/app
      PORT: 3000
      API_PROXY_TARGET: http://backend:3001
      AWS_REGION: us-east-1
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_PRESIGN_ENDPOINT: http://localhost:9000
      AWS_S3_BUCKET: crewlly-procedures
      AWS_S3_PUBLIC_BASE_URL: http://localhost:9000/crewlly-procedures
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      minio:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    command: sh -c "npx prisma@5.19.1 generate && npx prisma@5.19.1 db push && npm run dev -- -H 0.0.0.0 -p 3001"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "1"
      DATABASE_URL: postgresql://app:app@db:5432/app
      PORT: 3001
      AWS_REGION: us-east-1
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_PRESIGN_ENDPOINT: http://localhost:9000
      AWS_S3_BUCKET: crewlly-procedures
      AWS_S3_PUBLIC_BASE_URL: http://localhost:9000/crewlly-procedures
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
      - backend_next:/app/.next
    depends_on:
      minio:
        condition: service_started

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      /usr/bin/mc mb --ignore-existing local/$$MINIO_BUCKET &&
      /usr/bin/mc anonymous set download local/$$MINIO_BUCKET;
      "
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_BUCKET: crewlly-procedures

volumes:
  frontend_node_modules:
  frontend_next:
  backend_node_modules:
  backend_next:
  minio_data:
